[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-tool"
dynamic = ["version"]
description = "Debian 系本地软件包盘点与管理工具（零第三方依赖）"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "pkgtool.__version__"}

[project.scripts]
pkgtool = "pkgtool.cli:main"

[tool.setuptools.packages.find]
include = ["pkgtool*"]
